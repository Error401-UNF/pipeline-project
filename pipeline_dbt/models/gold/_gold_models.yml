version: 2

models:
  - name: average_product_per_category
    description: "Calculates the baseline metrics for each category. This serves as the 'mean' product reference point for all subsequent delta calculations."
    columns:
      - name: category_id
        tests:
          - not_null
          - unique
      - name: category_name
        tests:
          - not_null
      - name: average_stars
      - name: average_reviews
      - name: average_price
      - name: average_listPrice

  - name: full_average_delta
    description: "A product-level table showing how much each item deviates from its category average. Positive values indicate better-than-average performance or higher-than-average price."
    columns:
      - name: asin
        tests:
          - unique
          - not_null
      - name: title
      - name: reviews
      - name: stars
      - name: adjusted_stars
      - name: adjusted_price
      - name: reviews
        tests:
          - accepted_range:
              min_value: 100

  - name: top_average_delta
    description: "The 'Leaderboard' table. It identifies the Top 5 products in every category based on their performance relative to the category mean."
    columns:
      - name: asin
        tests:
          - unique
          - not_null
      - name: title
      - name: category_id
      - name: stars
      - name: reviews
      - name: adjusted_price
      - name: adjusted_listPrice
      - name: category_rank
        tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: average_price_delta_per_rating
    description: "An analysis table that groups products into 10 star buckets (0.5 increments) and calculates the percentage price premium/discount for that bucket."
    columns:
      - name: star_bucket
        tests:
          - not_null
      - name: avg_price_delta_percent
      - name: avg_listprice_delta_percent
    
  
  - name: average_price_delta_per_rating_per_catagory
    description: "An analysis table that groups products into 10 star buckets (0.5 increments) and calculates the percentage price premium/discount for that bucket. Splits an aditional time by catagory"
    columns:
      - name: star_bucket
        tests:
          - not_null
      - name: avg_price_delta_percent
      - name: avg_listprice_delta_percent


